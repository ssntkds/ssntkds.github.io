<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лупа ×3 на всю ширину</title>
  <style>
    body {
      margin: 0;
      background: #f8f9fa;
      font-family: sans-serif;
    }

    .img-container {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    img {
      width: 100%;   /* на всю ширину экрана */
      height: auto;  /* сохраняем пропорции */
      display: block;
    }

    /* Лупа */
    .lens {
      position: absolute;
      border: 2px solid #333;
      width: 150px;   /* можно увеличить размер лупы */
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
    }

    .lens img {
      position: absolute;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="img-container">
    <!-- Твое изображение -->
    <img id="original" src="images/qqqq2.png" alt="Demo">
    <div class="lens"><img id="zoomed" src="images/qqqq2.png" alt=""></div>
  </div>

  <script>
    const container = document.querySelector(".img-container");
    const original = document.getElementById("original");
    const lens = document.querySelector(".lens");
    const zoomed = document.getElementById("zoomed");

    // коэффициент увеличения
    const scale = 3;
    zoomed.style.transform = `scale(${scale})`;

    container.addEventListener("mousemove", (e) => {
      const rect = original.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
        lens.style.display = "none";
        return;
      }

      lens.style.display = "block";
      lens.style.left = (x - lens.offsetWidth / 2) + "px";
      lens.style.top = (y - lens.offsetHeight / 2) + "px";

      zoomed.style.left = -(x) + "px";
      zoomed.style.top = -(y) + "px";
    });

    container.addEventListener("mouseleave", () => {
      lens.style.display = "none";
    });
  </script>
</body>
</html>
