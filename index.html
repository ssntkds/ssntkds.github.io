<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лупа ×3 на всю ширину</title>
  <style>
    body {
      margin: 0;
      background: #f8f9fa;
      font-family: sans-serif;
    }

    .img-container {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    #original {
      width: 100%;   /* изображение тянется на всю ширину */
      height: auto;
      display: block;
    }

    /* Лупа */
    .lens {
      position: absolute;
      border: 2px solid #333;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
      display: none;
    }

    .lens img {
      position: absolute;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="img-container">
    <!-- Основное изображение -->
    <img id="original" src="qqqq2.png" alt="Demo">
    <!-- Внутри лупы — то же изображение, но будем двигать и увеличивать -->
    <div class="lens">
      <img id="zoomed" src="qqqq2.png" alt="">
    </div>
  </div>

  <script>
    const original = document.getElementById("original");
    const lens = document.querySelector(".lens");
    const zoomed = document.getElementById("zoomed");

    // коэффициент увеличения
    const scale = 3;
    zoomed.style.transform = `scale(${scale})`;

    document.querySelector(".img-container").addEventListener("mousemove", (e) => {
      const rect = original.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
        lens.style.display = "none";
        return;
      }

      lens.style.display = "block";

      // позиция лупы
      lens.style.left = (x - lens.offsetWidth / 2) + "px";
      lens.style.top = (y - lens.offsetHeight / 2) + "px";

      // вычисляем реальный размер картинки
      const realWidth = original.naturalWidth;
      const realHeight = original.naturalHeight;

      const ratioX = realWidth / rect.width;
      const ratioY = realHeight / rect.height;

      // смещение увеличенной картинки
      zoomed.style.left = -(x * ratioX) + "px";
      zoomed.style.top = -(y * ratioY) + "px";
    });

    document.querySelector(".img-container").addEventListener("mouseleave", () => {
      lens.style.display = "none";
    });
  </script>
</body>
</html>
