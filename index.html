<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лупа ×3 на всю ширину</title>
  <style>
    body {
      margin: 0;
      background: #f8f9fa;
      font-family: sans-serif;
    }

    .img-container {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    #original {
      width: 100%;
      height: auto;
      display: block;
    }

    .lens {
      position: absolute;
      border: 2px solid #333;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
      display: none;
    }

    .lens img {
      position: absolute;
      width: auto;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="img-container">
    <img id="original" src="qqqq2.png" alt="Demo">
    <div class="lens"><img id="zoomed" src="qqqq2.png" alt=""></div>
  </div>

  <script>
    const original = document.getElementById("original");
    const lens = document.querySelector(".lens");
    const zoomed = document.getElementById("zoomed");

    const scale = 3;

    original.addEventListener("load", () => {
      // выставляем размер zoomed = натуральный размер * scale
      zoomed.width = original.naturalWidth * scale;
      zoomed.height = original.naturalHeight * scale;
    });

    document.querySelector(".img-container").addEventListener("mousemove", (e) => {
      const rect = original.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
        lens.style.display = "none";
        return;
      }

      lens.style.display = "block";
      lens.style.left = (x - lens.offsetWidth / 2) + "px";
      lens.style.top = (y - lens.offsetHeight / 2) + "px";

      // пропорции между оригинальной картинкой и отображаемой
      const ratioX = original.naturalWidth / rect.width;
      const ratioY = original.naturalHeight / rect.height;

      // смещение увеличенной картинки внутри лупы
      zoomed.style.left = -(x * ratioX * scale - lens.offsetWidth / 2) + "px";
      zoomed.style.top = -(y * ratioY * scale - lens.offsetHeight / 2) + "px";
    });

    document.querySelector(".img-container").addEventListener("mouseleave", () => {
      lens.style.display = "none";
    });
  </script>
</body>
</html>
