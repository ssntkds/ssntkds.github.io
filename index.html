<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лупа с увеличением</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8f9fa;
      font-family: sans-serif;
    }

    .img-container {
      position: relative;
      margin-bottom: 20px;
    }

    img {
      max-width: 500px;
      border-radius: 10px;
      display: block;
    }

    /* лупа */
    .lens {
      position: absolute;
      border: 2px solid #333;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
      transition: left 0.1s ease, top 0.1s ease; /* плавность */
    }

    .lens img {
      position: absolute;
      transform-origin: top left;
      transition: transform 0.2s ease; /* плавность при изменении масштаба */
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="img-container">
    <img id="original" src="qqqq2.png" alt="Demo">
    <div class="lens"><img id="zoomed" src="qqqq2.png" alt=""></div>
  </div>

  <div class="controls">
    <label for="zoom">Увеличение:</label>
    <input type="range" id="zoom" min="1" max="4" step="0.1" value="2">
    <span id="zoom-value">2×</span>
  </div>

  <script>
    const container = document.querySelector(".img-container");
    const original = document.getElementById("original");
    const lens = document.querySelector(".lens");
    const zoomed = document.getElementById("zoomed");
    const zoomRange = document.getElementById("zoom");
    const zoomValue = document.getElementById("zoom-value");

    let scale = parseFloat(zoomRange.value);

    zoomRange.addEventListener("input", () => {
      scale = parseFloat(zoomRange.value);
      zoomed.style.transform = `scale(${scale})`;
      zoomValue.textContent = scale.toFixed(1) + "×";
    });

    container.addEventListener("mousemove", (e) => {
      const rect = original.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
        lens.style.display = "none";
        return;
      }

      lens.style.display = "block";
      lens.style.left = (x - lens.offsetWidth / 2) + "px";
      lens.style.top = (y - lens.offsetHeight / 2) + "px";

      zoomed.style.left = -(x) + "px";
      zoomed.style.top = -(y) + "px";
    });

    container.addEventListener("mouseleave", () => {
      lens.style.display = "none";
    });

    // начальный масштаб
    zoomed.style.transform = `scale(${scale})`;
  </script>
</body>
</html>
